# Builds the two images the Railway template deploys, so a deploy pulls finished images instead
# of building on Railway's builders. Each push to main gets
#   ghcr.io/<this repo>:<short sha>            Materialious (repo root)
#   ghcr.io/<this repo>/invidious:<short sha>  Invidious with the restart wrapper (invidious/)
# Point template-config.json at them, then republish.
name: Image
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "template-*.json", "icon.png", "LICENSE"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository_owner == 'two-workspaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }},ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: invidious
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/invidious:${{ env.SHORT_SHA }},ghcr.io/${{ github.repository }}/invidious:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=invidious
          cache-to: type=gha,mode=max,scope=invidious
